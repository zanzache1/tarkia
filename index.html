<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة تحيين الترقيات 2026-2027</title>
<style>
/* الخطوط الأصلية لضمان المظهر الاحترافي */
@font-face{font-family:'MohammadHead';src:local('Mohammad Head'),local('MohammadHead'),url('MohammadHead.woff2') format('woff2'),url('MohammadHead.ttf') format('truetype');font-display:swap}
@font-face{font-family:'BaradaReqa';src:local('Barada Reqa'),local('BaradaReqa'),local('Barada Reqa Regular'),url('BaradaReqa.woff2') format('woff2'),url('BaradaReqa.ttf') format('truetype');font-display:swap}
@font-face{font-family:'MohammadBoldArt1';src:local('Mohammad Bold Art 1'),local('MohammadBoldArt1'),local('Mohammad Bold Art'),url('MohammadBoldArt1.woff2') format('woff2'),url('MohammadBoldArt1.ttf') format('truetype');font-weight:100 900;font-display:swap}

:root{
  --green:#5b2a86; /* البنفسجي الأساسي */
  --red:#d21034;   /* الأحمر للتنبيه */
  --brown:#6a2c91; /* البنفسجي الغامق للنصوص */
  --fh:'MohammadHead','Katibeh','Amiri',serif;
  --fc:'MohammadBoldArt1','MohammadHead',Tahoma,Arial,sans-serif;
  --fb:'BaradaReqa','Aref Ruqaa Ink','Katibeh','Amiri',serif;
}

*,*::before,*::after{box-sizing:border-box}

body {
  margin: 0;
  min-height: 100vh;
  padding: 24px 14px;
  background: #43206b; /* الخلفية الأرجوانية للمنصة */
  color: #333;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.wrap {
  width: min(1040px, 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ===== هيدر السبّورة (تصميم إسناد) ===== */
.blackboard {
  position: relative;
  isolation: isolate;
  width: 100%;
  margin-bottom: 36px;
  padding: 22px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  color: #fffde9;
  text-align: center;
  border: 13px solid #b78ae0; /* إطار السبورة */
  border-radius: 10px;
  background-color: #0a0a0a;
  background-image: radial-gradient(ellipse at 20% 30%,#ffffff0b 0 1px,transparent 2px),radial-gradient(ellipse at 70% 65%,#ffffff0a 0 1px,transparent 2px),repeating-linear-gradient(2deg,#ffffff03 0 1px,transparent 1px 5px),linear-gradient(145deg,#1c1c1c,#050505 70%,#141414);
  box-shadow: inset 0 0 0 3px #ffffff14, inset 0 0 28px #0009, 0 12px 24px #0008;
}

.blackboard::after {
  content: "";
  position: absolute;
  z-index: 0;
  bottom: -22px;
  left: 10%;
  width: 80%;
  height: 12px;
  border: 2px solid #4a2a70;
  border-radius: 0 0 7px 7px;
  background: linear-gradient(#a982d6,#5b3a8a);
  box-shadow: 0 5px 7px #0005;
}

.seal, .badge {
  flex: 0 0 140px;
  width: 140px;
  height: 140px;
}

.seal img, .badge img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.badge {
  background: conic-gradient(from 210deg,#fff3b4,#e2b53a 18%,#a77408 38%,#f6dc7a 56%,#c9971f 76%,#fff0a8 100%);
  border-radius: 50%;
  padding: 8px;
  box-shadow: 0 6px 12px #000a;
}

.title-box { flex: 1; min-width: 0; }
h1 {
  margin: 0;
  color: #fff;
  font-family: var(--fh);
  font-size: clamp(28px, 5vw, 50px);
  text-shadow: 0 0 10px #ffeb3b;
  animation: glow 3s infinite;
}
@keyframes glow { 0%,100%{opacity:1} 50%{opacity:0.8} }
.sub-title { color: #ffeb3b; font-family: var(--fb); margin-top: 5px; font-size: 18px; }

/* ===== البطاقات البيضاء للنصوص والحقول ===== */
.card {
  width: 100%;
  max-width: 850px;
  margin-bottom: 22px;
  padding: 30px;
  background: #ffffff; /* اللون الأبيض للبطاقة */
  border-radius: 8px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

h2 {
  margin: -30px -30px 20px -30px;
  padding: 15px;
  background: var(--green);
  color: white;
  text-align: center;
  border-radius: 8px 8px 0 0;
  font-family: var(--fh);
}

/* ===== الحقول والاستمارات ===== */
.f { margin-bottom: 15px; }
.f label { display: block; margin-bottom: 8px; color: var(--green); font-family: var(--fh); font-size: 20px; }
input, select {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 5px;
  font-family: var(--fc);
  font-size: 17px;
  color: var(--brown);
}

/* ===== الأزرار ===== */
.btn-submit {
  width: 100%;
  padding: 15px;
  background: var(--green);
  color: white;
  border: none;
  border-radius: 5px;
  font-family: var(--fh);
  font-size: 24px;
  cursor: pointer;
  transition: 0.3s;
}
.btn-submit:hover { background: var(--red); transform: translateY(-2px); }

/* ===== الجدول التفاعلي ===== */
.table-wrap { overflow-x: auto; border: 1px solid #ddd; border-radius: 5px; }
.data-table { width: 100%; border-collapse: collapse; background: white; }
.data-table th { background: var(--green); color: white; padding: 12px; font-family: var(--fh); }
.data-table td { padding: 12px; text-align: center; border-bottom: 1px solid #eee; font-weight: bold; color: var(--brown); }

footer { margin-top: 30px; text-align: center; color: #ffeb3b; font-family: var(--fb); }
</style>
</head>
<body>

<div class="wrap">
  <!-- رأس الصفحة (تصميم السبورة) -->
  <header class="blackboard">
    <div class="seal"><img src="data:image/webp;base64,UklGRvIkAQBXRUJQVlA4WAoAAAAQAAAAowEAowEAQUxQSPAVAAAB8If/v7o5rbZ9vmutc1wyk5nIJMHaRkgIwZ1NcQkS6klxKHX34mz0OFxqaAJJqSCFhLq3yMZh+964xSaG7cz6ru/nj5mMnrJ+W64rIiYAVbIAgIjHljs6es67fOEFK1b89ONXPfLw8gdWrFixYvmK6xd+aPIHF35s0cKLPvn9UxcuXLTwmhXLl6+4ZeHChfPGdWBgH0IITgCIiCAruxACAGz7ofZDzjx92YNrVq3nMK/nMG9eveZvS5ddP7e9HQO74JGPRXwIjePRf9yhi9f1rucWzXRAY9JBJiZVVUtMOngObOvX33/n948/vqcNQH3z+Ene5R3pJ17Qv2vKqT9a9mgv+yfVqGbGYTYOs5lpjJFbfHPt8u8v2K5r6lQ0TQjBSaZxAMQHAN2HHHvO0uffYv+UzIxj2sw0xhjZf8PqH37xuGnoH4KT/CJAZz2A5kMvXckBNcZkLJ9mGiP7v7|... (seal data)" alt="الختم"></div>
    <div class="title-box">
      <h1>منصة تحيين الترقيات</h1>
      <div class="sub-title">مفتشية التعليم الابتدائي - المقاطعة الأولى</div>
    </div>
    <div class="badge"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAZAAAAGQCAIAAAAP3aGbAAEAAElEQVR42uxddXwUV9c+946tZjfJxpUIIWhwp0CFKm2hSt3d9au7uxu1t6Ve2kJLKRT3ACEQiLt7sr47M/d+f9ZnTYBAaUsAtntefrw0sjs7M/eZc577nOcg" alt="شعار الوزارة"></div>
  </header>

  <!-- بطاقة البيانات -->
  <section class="card">
    <h2>تعبئة بيانات الترقية</h2>
    <form id="promoForm">
      <div class="f">
        <label>اسم المؤسسة</label>
        <select id="inst" required>
          <option value="">اختر المؤسسة...</option>
        </select>
      </div>
      <div class="f">
        <label>لقب واسم الأستاذ(ة)</label>
        <input type="text" id="name" placeholder="أدخل اللقب والاسم" required>
      </div>
      <div class="f">
        <label>الدرجة الجديدة</label>
        <select id="grade" required></select>
      </div>
      <div class="f">
        <label>تاريخ النفاذ</label>
        <input type="date" id="date" required>
      </div>
      <button type="submit" id="btn" class="btn-submit">إرسال البيانات الآن</button>
    </form>
    <div id="status" style="text-align:center; margin-top:10px; font-weight:bold;"></div>
  </section>

  <!-- جدول عرض النتائج -->
  <section class="card">
    <h2>آخر المعلومات المرسلة</h2>
    <div class="table-wrap">
      <table class="data-table" id="resTable">
        <thead>
          <tr>
            <th>المؤسسة</th>
            <th>الأستاذ</th>
            <th>الدرجة</th>
            <th>التاريخ</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>

  <footer>
    <div>برمجة الأستاذ/المفتش: بلعدل محمد</div>
    <div>حقوق النشر محفوظة 2026/2027</div>
  </footer>
</div>

<script>
var API_URL = "https://script.google.com/macros/s/AKfycbzglOvsoQFhIVII0Z28J0jUt3_I-15VrdaiVmveBqgdMciPKenckf_aAyAAu6lalrnXiA/exec";

  var INST = ["ابتدائية طارق بن زياد حدّ الصّحاري","ابتدائية بن عثمان الشيخ حدّ الصّحاري","ابتدائية زيوش محمد حدّ الصّحاري","ابتدائية نوع ب حد الصحاري حدّ الصّحاري","ابتدائية عكار أحمد حدّ الصّحاري","ابتدائية المجاهد قويدري خليفة حدّ الصّحاري","ابتدائية نمط 2 حي 165 مسكن حدّ الصّحاري","ابتدائية العقيد عميروش بويرة الأحداب","ابتدائية الشيخ المختار خليفة بويرة الأحداب","ابتدائية الصقيعة بويرة الأحداب","ابتدائية اولاد سي عمر بويرة الأحداب","ابتدائية وادي بوعيشة بويرة الأحداب","ابتدائية حاسي الدهيم بويرة الأحداب","ابتدائية المجمع المدرسي الجديد بويرة الأحداب","ابتدائية وادي بوتشيشة بويرة الأحداب","ابتدائية حي المخرج الغربي بويرة الأحداب"];

// ملء القوائم
var instSel = document.getElementById('inst');
INST.forEach(v => instSel.add(new Option(v, v)));

var gradeSel = document.getElementById('grade');
for(var i=1; i<=12; i++) gradeSel.add(new Option("الدرجة "+i, i));

// التحميل الأولي من الذاكرة
var localData = JSON.parse(localStorage.getItem('my_promos') || "[]");
renderTable();

document.getElementById('promoForm').onsubmit = function(e) {
  e.preventDefault();
  var btn = document.getElementById('btn');
  var status = document.getElementById('status');
  
  var payload = {
    inst: document.getElementById('inst').value,
    name: document.getElementById('name').value,
    grade: document.getElementById('grade').value,
    date: document.getElementById('date').value,
    token: "promotion_tarkia"
  };

  btn.disabled = true;
  status.textContent = "جاري الإرسال والمزامنة...";
  status.style.color = "blue";

  fetch(API_URL, {
    method: "POST",
    mode: "no-cors",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)
  }).then(() => {
    status.textContent = "✅ تم الإرسال بنجاح!";
    status.style.color = "green";
    localData.unshift(payload);
    localStorage.setItem('my_promos', JSON.stringify(localData.slice(0,10)));
    renderTable();
    document.getElementById('promoForm').reset();
  }).catch(err => {
    status.textContent = "❌ فشل الإرسال، حاول ثانية";
    status.style.color = "red";
  }).finally(() => {
    btn.disabled = false;
  });
};

function renderTable() {
  var html = "";
  localData.forEach(r => {
    html += `<tr><td>${r.inst}</td><td>${r.name}</td><td>${r.grade}</td><td>${r.date}</td></tr>`;
  });
  document.getElementById('tbody').innerHTML = html;
}
</script>
</body>
</html>
