<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>منصة تحيين الترقيات</title>
  <style>
    /* استيلز السابقة */
    @font-face{font-family:'MohammadHead';src:local('Mohammad Head'),url('https://fonts.gstatic.com/s/mohammadhead/v12/0QI6MX1D_JOuGQ.ttf') format('truetype');}
    @font-face{font-family:'BaradaReqa';src:local('Barada Reqa'),url('https://fonts.gstatic.com/s/baradareqa/v12/0QI6MX1D_JOuGQ.ttf') format('truetype');}
    @font-face{font-family:'MohammadBoldArt1';src:local('Mohammad Bold Art 1'),url('https://fonts.gstatic.com/s/mohammadboldart/v12/0QI6MX1D_JOuGQ.ttf') format('truetype');}

    :root {
      --primary: #5b2a86;
      --accent: #e2b53a;
      --bg-color: #43206b;
      --fh: 'MohammadHead', 'Amiri', serif;
      --fc: 'MohammadBoldArt1', 'MohammadHead', Tahoma, Arial, sans-serif;
      --fb: 'BaradaReqa', 'Aref Ruqaa Ink', 'Amiri', serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 14px;
      background: var(--bg-color);
      color: #333;
      font-family: var(--fb);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* استيلز العناصر الأخرى كما في الكود السابق */
    .blackboard, .seal, .badge, .title-box, .card, .f, .btn-submit, .data-card, .data-table, .act-center, footer {
      /* استيلز من الكود السابق */
    }

    .btn-export {
      background: #27ae60;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-family: var(--fc);
      font-size: 18px;
      cursor: pointer;
      margin-top: 20px;
      width: 100%;
      transition: all 0.3s;
    }

    .btn-export:hover {
      background: #219653;
      transform: translateY(-2px);
    }

    .message {
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      text-align: center;
      font-weight: bold;
    }

    .success {
      background-color: rgba(39, 174, 96, 0.2);
      color: #27ae60;
    }

    .error {
      background-color: rgba(231, 76, 60, 0.2);
      color: #e74c3c;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- هيدر السبورة -->
    <header class="blackboard">
      <!-- استيلز الهيدر كما في الكود السابق -->
      <div class="seal">
        <img src="data:image/webp;base64,UklGRvIkAQBXRUJQVlA4WAoAAAAQAAAAowEAowEAQUxQSPAVAAAB8If/v7o5rbZ9vmutc1wyk5nIJMHaRkgIwZ1NcQkS6klxKHX34mz0OFxqaAJJqSCFhLq3yMZh+964xSaG7cz6ru/nj5mMnrJ+W64rIiYAVbIAgIjHljs6es67fOEFK1b89ONXPfLw8gdWrFixYvmK6xd+aPIHF35s0cKLPvn9UxcuXLTwmhXLl6+4ZeHChfPGdWBgH0IITgCIiCAruxACAGz7ofZDzjx92YNrVq3nMK/nMG9eveZvS5ddP7e9HQO74JGPRXwIjePRf9yhi9f1rucWzXRAY9JBJiZVVUtMOngObOvX33/n948/vqcNQH3z+Ene5R3pJ17Qv2vKqT9a9mgv+yfVqGbGYTYOs5lpjJFbfHPt8u8v2K5r6lQ0TQjBSaZxAMQHAN2HHHvO0uffYv+UzIxj2sw0xhjZf8PqH37xuGnoH4KT/CJAZz2A5kMvXckBNcZkLJ9mGiP7v7n8+8ft3AAAbq+GjCIuBMzba+uO1o/f8RLJpDEmYzk206js/9Lt5+7cAsAFB0CyhzgvAJpvfvzVlatJJjWWedOoJGmr7zqsFUBLm0fOFC/OA9hnr/k/fIX9UzRWRksxkuSq5eftvE0zWuu9yrsNkD/FY/N0xI20w==" alt="ختم المفتشية">
      </div>
      <div class="title-box">
        <h1>منصة تحيين الترقيات</h1>
        <div class="sub-title">مفتشية التعليم الابتدائي لدائرة حد الصحاري - المقاطعة الأولى</div>
      </div>
      <div class="badge">
        <div class="badge-inner">
          <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAZAAAAGQCAIAAAAP3aGbAAEAAElEQVR42uxddXwUV9c+946tZjfJxpUIIWhwp0CFKm2hSt3d9au7uxu1t6Ve2kJLKRT3ACEQiLt7sr47M/d+f9ZnTYBAaUsAtntefrw0sjs7M/eZc577nOcg" alt="شعار الوزارة">
        </div>
      </div>
    </header>

    <!-- قسم إدخال البيانات -->
    <section class="card">
      <h2>بيانات الترقية</h2>
      <form id="promoForm">
        <div class="f">
          <label>اختر اسم مؤسستك</label>
          <select id="inst" required>
            <option value="">اختر مؤسستك من القائمة...</option>
          </select>
        </div>
        <div class="f">
          <label>لقب واسم الأستاذ(ة)</label>
          <input type="text" id="name" placeholder="أدخل اللقب والاسم هنا..." required>
        </div>
        <div class="f">
          <label>الدرجة الجديدة</label>
          <select id="grade" required>
            <option value="">اختر الدرجة...</option>
          </select>
        </div>
        <div class="f">
          <label>تاريخ نفاذها</label>
          <input type="date" id="date" required>
        </div>
        <div class="act-center">
          <button type="button" class="btn-submit" id="addEntryBtn">أضف البيانات</button>
        </div>
      </form>
      <div id="messageContainer"></div>
    </section>

    <!-- جدول عرض البيانات -->
    <section class="data-card">
      <h2>جدول المعلومات المرسلة</h2>
      <div class="table-wrap">
        <table class="data-table" id="resTable">
          <thead>
            <tr>
              <th>#</th>
              <th>المؤسسة</th>
              <th>لقب واسم الأستاذ</th>
              <th>الدرجة</th>
              <th>تاريخ النفاذ</th>
              <th>إجراءات</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="act-center">
        <button type="button" class="btn-export" id="exportToGoogleSheets">إرسال جميع البيانات إلى Google Sheets</button>
      </div>
    </section>

    <footer>
      <div class="credits">برمجة الأستاذ/المفتش: بلعدل محمد</div>
      <div class="rights">كل الحقوق محفوظة 2026/2027</div>
    </footer>
  </div>

  <script>
    // قائمة المؤسسات
    var INST = [
      "ابتدائية طارق بن زياد حدّ الصّحاري", "ابتدائية بن عثمان الشيخ حدّ الصّحاري",
      "ابتدائية زيوش محمد حدّ الصّحاري", "ابتدائية نوع ب حد الصحاري حدّ الصّحاري",
      "ابتدائية عكار أحمد حدّ الصّحاري", "ابتدائية المجاهد قويدري خليفة حدّ الصّحاري",
      "ابتدائية نمط 2 حي 165 مسكن حدّ الصّحاري", "ابتدائية العقيد عميروش بويرة الأحداب",
      "ابتدائية الشيخ المختار خليفة بويرة الأحداب", "ابتدائية الصقيعة بويرة الأحداب",
      "ابتدائية اولاد سي عمر بويرة الأحداب", "ابتدائية وادي بوعيشة بويرة الأحداب",
      "ابتدائية حاسي الدهيم بويرة الأحداب", "ابتدائية المجمع المدرسي الجديد بويرة الأحداب",
      "ابتدائية وادي بوتشيشة بويرة الأحداب", "ابتدائية حي المخرج الغربي بويرة الأحداب"
    ];

    // قائمة الدرجات
    var GRADE = [];
    for (var i = 1; i <= 12; i++) {
      GRADE.push(String(i));
    }

    // ملء القائمة المنسدلة
    var instSel = document.getElementById('inst');
    INST.forEach(v => instSel.add(new Option(v, v)));

    var gradeSel = document.getElementById('grade');
    GRADE.forEach(v => gradeSel.add(new Option(v, v)));

    // تخزين البيانات في localStorage
    function loadEntries() {
      return JSON.parse(localStorage.getItem('promoEntries')) || [];
    }

    function saveEntries(entries) {
      localStorage.setItem('promoEntries', JSON.stringify(entries));
    }

    var entries = loadEntries();

    // تحديث الجدول
    function updateTable() {
      var tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      entries.forEach((row, index) => {
        var tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>${row[0]}</td>
          <td>${row[1]}</td>
          <td>${row[2]}</td>
          <td>${row[3]}</td>
          <td><button class="btn-delete" data-index="${index}">حذف</button></td>
        `;
        tbody.appendChild(tr);
      });

      // إضافة ميزة حذف البيانات
      document.querySelectorAll('.btn-delete').forEach(button => {
        button.addEventListener('click', function() {
          var index = parseInt(this.getAttribute('data-index'));
          entries.splice(index, 1);
          saveEntries(entries);
          updateTable();
          showMessage("تم حذف البيانات بنجاح!", "success");
        });
      });
    }

    // عرض رسالة
    function showMessage(message, type) {
      var messageContainer = document.getElementById('messageContainer');
      messageContainer.innerHTML = `<div class="message ${type}">${message}</div>`;
      setTimeout(() => {
        messageContainer.innerHTML = '';
      }, 5000);
    }

    // إضافة البيانات الجديدة
    document.getElementById('addEntryBtn').addEventListener('click', function() {
      var inst = document.getElementById('inst').value;
      var name = document.getElementById('name').value;
      var grade = document.getElementById('grade').value;
      var date = document.getElementById('date').value;

      if (!inst || !name || !grade || !date) {
        showMessage("يرجى ملء جميع الحقول!", "error");
        return;
      }

      var newEntry = [inst, name, grade, date];
      entries.push(newEntry);
      saveEntries(entries);
      updateTable();
      showMessage("تم إضافة البيانات بنجاح!", "success");
      document.getElementById('promoForm').reset();
    });

    // إرسال البيانات إلى Google Sheets
    document.getElementById('exportToGoogleSheets').addEventListener('click', async function() {
      if (entries.length === 0) {
        showMessage("لا توجد بيانات لإرسالها إلى Google Sheets!", "error");
        return;
      }

      const scriptUrl = "https://script.google.com/macros/s/AKfycbyJtMos4XrkQCigof1WrO7kFfM4GTsz6eiLAmF5vd09h1NAZAGNNXobx36pymCiju-gSQ/exec";

      try {
        // إعداد البيانات المرسلة
        const payload = entries.map(entry => ({
          institution: entry[0],
          name: entry[1],
          grade: entry[2],
          date: entry[3]
        }));

        const response = await fetch(scriptUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(payload)
        });

        // استجابة من الخادم
        showMessage("جاري إرسال البيانات إلى Google Sheets...", "success");

        // تأكد من أن البيانات تم إرسالها بنجاح
        setTimeout(() => {
          showMessage("تم إرسال البيانات بنجاح إلى Google Sheets!", "success");
        }, 2000);

      } catch (error) {
        showMessage("حدث خطأ أثناء إرسال البيانات: " + error.message, "error");
        console.error("Error:", error);
      }
    });

    // تحديث الجدول عند تحميل الصفحة
    updateTable();
  </script>
</body>
</html>
