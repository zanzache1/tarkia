<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>منصة تحيين الترقيات</title>
  <style>
    /* اضف هنا نفس الكود السTYLE من سابق */
    /* ... */
  </style>
</head>
<body>
  <!-- قسم من سابق الكود -->
  <div class="wrap">
    <!-- هيدر السبورة -->
    <header class="blackboard">
      <!-- ... -->
    </header>

    <!-- قسم البيانات -->
    <section class="card">
      <h2>بيانات الترقية</h2>
      <form id="promoForm">
        <div class="f">
          <label>اختر اسم مؤسستك</label>
          <select id="inst" required>
            <option value="">اختر مؤسستك من القائمة...</option>
            <!-- ... -->
          </select>
        </div>
        <div class="f">
          <label>لقب واسم الأستاذ(ة)</label>
          <input type="text" id="name" placeholder="أدخل اللقب والاسم هنا..." required>
        </div>
        <div class="f">
          <label>الدرجة الجديدة</label>
          <select id="grade" required>
            <!-- ... -->
          </select>
        </div>
        <div class="f">
          <label>تاريخ نفاذها</label>
          <input type="date" id="date" required>
        </div>
        <div class="act-center">
          <button type="button" class="btn-submit" id="submitBtn">إرسال البيانات إلى Google Sheets</button>
        </div>
      </form>
    </section>

    <!-- قسم عرض البيانات -->
    <section class="data-card">
      <h2>جدول المعلومات المرسلة</h2>
      <div class="table-wrap">
        <table class="data-table" id="resTable">
          <thead>
            <tr>
              <th>#</th>
              <th>المؤسسة</th>
              <th>لقب واسم الأستاذ</th>
              <th>الدرجة</th>
              <th>تاريخ النفاذ</th>
            </tr>
          </thead>
          <tbody id="tableBody">
          </tbody>
        </table>
      </div>
    </section>

    <!-- قسم إرسال البيانات إلى Google Sheets -->
    <div id="exportToSheet" style="display: none;">
      <h3>إرسال البيانات إلى Google Sheets</h3>
      <input type="hidden" id="googleScriptUrl" value="https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec">
      <button id="submitDataToSheet" class="btn-export">إرسال البيانات</button>
    </div>

    <footer>
      <!-- ... -->
    </footer>
  </div>

  <script>
    var INST = [
      "ابتدائية طارق بن زياد حدّ الصّحاري", "ابتدائية بن عثمان الشيخ حدّ الصّحاري",
      "ابتدائية زيوش محمد حدّ الصّحاري", "ابتدائية نوع ب حد الصحاري حدّ الصّحاري",
      "ابتدائية عكار أحمد حدّ الصّحاري", "ابتدائية المجاهد قويدري خليفة حدّ الصّحاري",
      "ابتدائية نمط 2 حي 165 مسكن حدّ الصّحاري", "ابتدائية العقيد عميروش بويرة الأحداب",
      "ابتدائية الشيخ المختار خليفة بويرة الأحداب", "ابتدائية الصقيعة بويرة الأحداب",
      "ابتدائية اولاد سي عمر بويرة الأحداب", "ابتدائية وادي بوعيشة بويرة الأحداب",
      "ابتدائية حاسي الدهيم بويرة الأحداب", "ابتدائية المجمع المدرسي الجديد بويرة الأحداب",
      "ابتدائية وادي بوتشيشة بويرة الأحداب", "ابتدائية حي المخرج الغربي بويرة الأحداب"
    ];

    var GRADE = [];
    for (var i = 1; i <= 12; i++) {
      GRADE.push(String(i));
    }

    // ملء القائمة المنسدلة للمؤسسات
    var instSel = document.getElementById('inst');
    instSel.add(new Option("اختر مؤسستك من القائمة...", ""));
    INST.forEach(v => instSel.add(new Option(v, v)));

    // ملء القائمة المنسدلة للدرجات
    var gradeSel = document.getElementById('grade');
    gradeSel.add(new Option("اختر الدرجة...", ""));
    GRADE.forEach(v => gradeSel.add(new Option(v, v)));

    // تخزين البيانات في localStorage
    function loadEntries() {
      return JSON.parse(localStorage.getItem('promoEntries')) || [];
    }

    function saveEntries(entries) {
      localStorage.setItem('promoEntries', JSON.stringify(entries));
    }

    // تحميل البيانات عند تحميل الصفحة
    var entries = loadEntries();

    // تحديث الجدول
    function updateTable() {
      var tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      entries.forEach((row, index) => {
        var tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>${row[0]}</td>
          <td>${row[1]}</td>
          <td>${row[2]}</td>
          <td>${row[3]}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // إرسال البيانات إلى Google Sheets
    document.getElementById('submitBtn').addEventListener('click', function() {
      var inst = document.getElementById('inst').value;
      var name = document.getElementById('name').value;
      var grade = document.getElementById('grade').value;
      var date = document.getElementById('date').value;

      if (!inst || !name || !grade || !date) {
        alert("يرجى ملء جميع الحقول!");
        return;
      }

      var newEntry = [inst, name, grade, date];
      entries.push(newEntry);
      saveEntries(entries);
      updateTable();
      alert("تم إضافة البيانات بنجاح!");

      // عرض قسم إرسال البيانات إلى Google Sheets
      document.getElementById('exportToSheet').style.display = 'block';
    });

    // إرسال البيانات إلى Google Sheets باستخدام الرابط
    document.getElementById('submitDataToSheet').addEventListener('click', async function() {
      const googleScriptUrl = document.getElementById('googleScriptUrl').value;
      const data = {
        institution: document.getElementById('inst').value,
        name: document.getElementById('name').value,
        grade: document.getElementById('grade').value,
        date: document.getElementById('date').value,
        token: "YOUR_TOKEN" // استبدل هذا بالرقم الذي تريد استخدامه
      };

      try {
        const response = await fetch(googleScriptUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();
        if (result.ok) {
          alert("تم إرسال البيانات إلى Google Sheets بنجاح!");
          document.getElementById('promoForm').reset();
          document.getElementById('exportToSheet').style.display = 'none';
        } else {
          alert("حدث خطأ أثناء إرسال البيانات: " + result.error);
        }
      } catch (error) {
        alert("حدث خطأ غير متوقع: " + error);
      }
    });

    // تحديث الجدول عند تحميل الصفحة
    updateTable();
  </script>
</body>
</html>
