<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة تحيين الترقيات 2026-2027</title>
<style>
@font-face{font-family:'MohammadHead';src:local('Mohammad Head'),local('MohammadHead'),url('MohammadHead.woff2') format('woff2'),url('MohammadHead.ttf') format('truetype');font-display:swap}
@font-face{font-family:'BaradaReqa';src:local('Barada Reqa'),local('BaradaReqa'),local('Barada Reqa Regular'),url('BaradaReqa.woff2') format('woff2'),url('BaradaReqa.ttf') format('truetype');font-display:swap}
@font-face{font-family:'MohammadBoldArt1';src:local('Mohammad Bold Art 1'),local('MohammadBoldArt1'),local('Mohammad Bold Art'),url('MohammadBoldArt1.woff2') format('woff2'),url('MohammadBoldArt1.ttf') format('truetype');font-weight:100 900;font-display:swap}

:root{
  --green:#5b2a86; --red:#d21034; --brown:#43206b;
  --fh:'MohammadHead','Katibeh','Amiri',serif;
  --fc:'MohammadBoldArt1','MohammadHead',Tahoma,Arial,sans-serif;
  --fb:'BaradaReqa','Aref Ruqaa Ink','Katibeh','Amiri',serif;
}

body { margin: 0; min-height: 100vh; padding: 24px 14px; background: #43206b; color: #333; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; }
.wrap { width: min(1040px, 100%); display: flex; flex-direction: column; align-items: center; }

/* ===== هيدر السبّورة (الكامل) ===== */
.blackboard { position: relative; isolation: isolate; width: 100%; margin-bottom: 36px; padding: 22px 24px; display: flex; align-items: center; justify-content: space-between; gap: 20px; color: #fffde9; text-align: center; border: 13px solid #b78ae0; border-radius: 10px; background-color: #0a0a0a; background-image: radial-gradient(ellipse at 20% 30%,#ffffff0b 0 1px,transparent 2px),radial-gradient(ellipse at 70% 65%,#ffffff0a 0 1px,transparent 2px),repeating-linear-gradient(2deg,#ffffff03 0 1px,transparent 1px 5px),linear-gradient(145deg,#1c1c1c,#050505 70%,#141414); box-shadow: inset 0 0 0 3px #ffffff14, inset 0 0 28px #0009, 0 12px 24px #0008; }

.seal, .badge { flex: 0 0 140px; width: 140px; height: 140px; }
.seal img, .badge img { display: block; width: 100%; height: 100%; object-fit: contain; }

.badge { background: conic-gradient(from 210deg,#fff3b4,#e2b53a 18%,#a77408 38%,#f6dc7a 56%,#c9971f 76%,#fff0a8 100%); border-radius: 50%; padding: 8px; box-shadow: 0 6px 12px #000a; }
.badge-inner { position: relative; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; }

.title-box { flex: 1; min-width: 0; }
h1 { margin: 0; color: #fff; font-family: var(--fh); font-size: clamp(28px, 5vw, 50px); text-shadow: 0 0 10px #ffeb3b; animation: glow 3s infinite; }
@keyframes glow { 0%,100%{opacity:1} 50%{opacity:0.8} }
.sub-title { color: #ffeb3b; font-family: var(--fb); margin-top: 5px; font-size: 18px; }

/* ===== البطاقات والحقول ===== */
.card { width: 100%; max-width: 850px; margin-bottom: 22px; padding: 30px; background: #ffffff; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
h2 { margin: -30px -30px 20px -30px; padding: 15px; background: var(--green); color: white; text-align: center; border-radius: 8px 8px 0 0; font-family: var(--fh); }
.f { margin-bottom: 15px; }
.f label { display: block; margin-bottom: 8px; color: var(--green); font-family: var(--fh); font-size: 20px; }
input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-family: var(--fc); font-size: 17px; color: var(--brown); }

.btn-submit { width: 100%; padding: 15px; background: var(--green); color: white; border: none; border-radius: 5px; font-family: var(--fh); font-size: 24px; cursor: pointer; transition: 0.3s; }
.btn-submit:hover { background: var(--red); transform: translateY(-2px); }

/* ===== الجدول ===== */
.table-wrap { overflow-x: auto; border: 1px solid #ddd; border-radius: 5px; margin-top: 15px; }
.data-table { width: 100%; border-collapse: collapse; background: white; }
.data-table th { background: var(--green); color: white; padding: 12px; font-family: var(--fh); text-align: center; }
.data-table td { padding: 12px; text-align: center; border-bottom: 1px solid #eee; font-weight: bold; color: var(--brown); }
.msg { margin-top: 15px; text-align: center; font-weight: bold; font-size: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="blackboard">
    <div class="seal"><img src="data:image/webp;base64,UklGRvIkAQBXRUJQVlA4WAoAAAAQAAAAowEAowEAQUxQSPAVAAAB8If/v7o5rbZ9vmutc1wyk5nIJMHaRkgIwZ1NcQkS6klxKHX34mz0OFxqaAJJqSCFhLq3yMZh+964xSaG7cz6ru/nj5mMnrJ+W64rIiYAVbIAgIjHljs6es67fOEFK1b89ONXPfLw8gdWrFixYvmK6xd+aPIHF35s0cKLPvn9UxcuXLTwmhXLl6+4ZeHChfPGdWBgH0IITgCIiCAruxACAGz7ofZDzjx92YNrVq3nMK/nMG9eveZvS5ddP7e9HQO74JGPRXwIjePRf9yhi9f1rucWzXRAY9JBJiZVVUtMOngObOvX33/n948/vqcNQH3z+Ene5R3pJ17Qv2vKqT9a9mgv+yfVqGbGYTYOs5lpjJFbfHPt8u8v2K5r6lQ0TQjBSaZxAMQHAN2HHHvO0uffYv+UzIxj2sw0xhjZf8PqH37xuGnoH4KT/CJAZz2A5kMvXckBNcZkLJ9mGiP7v7n8+8ft3AAAbq+GjCIuBMzba+uO1o/f8RLJpDEmYzk206js/9Lt5+7cAsAFB0CyhzgvAJpvfvzVlatJJjWWedOoJGmr7zqsFUBLm0fOFC/OA9hnr/k/fIX9UzRWRksxkuSq5eftvE0zWuu9yrsNkD/FY/N0xI20w==" alt="الختم"></div>
    <div class="title-box">
      <h1>منصة تحيين الترقيات</h1>
      <div class="sub-title">مفتشية التعليم الابتدائي - المقاطعة الأولى</div>
    </div>
    <div class="badge"><div class="badge-inner"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAZAAAAGQCAIAAAAP3aGbAAEAAElEQVR42uxddXwUV9c+946tZjfJxpUIIWhwp0CFKm2hSt3d9au7uxu1t6Ve2kJLKRT3ACEQiLt7sr47M/d+f9ZnTYBAaUsAtntefrw0sjs7M/eZc577nOcg" alt="شعار الوزارة"></div></div>
  </header>

  <section class="card">
    <h2>تعبئة بيانات الترقية</h2>
    <form id="promoForm">
      <div class="f"><label>اسم المؤسسة</label><select id="inst" required><option value="">اختر المؤسسة...</option></select></div>
      <div class="f"><label>لقب واسم الأستاذ(ة)</label><input type="text" id="name" placeholder="أدخل اللقب والاسم" required></div>
      <div class="f"><label>الدرجة الجديدة</label><select id="grade" required></select></div>
      <div class="f"><label>تاريخ النفاذ</label><input type="date" id="date" required></div>
      <button type="submit" id="btn" class="btn-submit">إرسال البيانات الآن</button>
      <div id="statusMsg" class="msg"></div>
    </form>
  </section>

  <section class="card">
    <h2>آخر المعلومات المرسلة</h2>
    <table class="data-table">
        <thead><tr><th>المؤسسة</th><th>الأستاذ</th><th>الدرجة</th><th>التاريخ</th></tr></thead>
        <tbody id="tableBody"></tbody>
    </table>
  </section>
</div>

<script>
var API_URL = "https://script.google.com/macros/s/AKfycbyJtMos4XrkQCigof1WrO7kFfM4GTsz6eiLAmF5vd09h1NAZAGNNXobx36pymCiju-gSQ/exec";

var INST = ["ابتدائية طارق بن زياد حدّ الصّحاري","ابتدائية بن عثمان الشيخ حدّ الصّحاري","ابتدائية زيوش محمد حدّ الصّحاري","ابتدائية نوع ب حد الصحاري حدّ الصّحاري","ابتدائية عكار أحمد حدّ الصّحاري","ابتدائية المجاهد قويدري خليفة حدّ الصّحاري","ابتدائية نمط 2 حي 165 مسكن حدّ الصّحاري","ابتدائية العقيد عميروش بويرة الأحداب","ابتدائية الشيخ المختار خليفة بويرة الأحداب","ابتدائية الصقيعة بويرة الأحداب","ابتدائية اولاد سي عمر بويرة الأحداب","ابتدائية وادي بوعيشة بويرة الأحداب","ابتدائية حاسي الدهيم بويرة الأحداب","ابتدائية المجمع المدرسي الجديد بويرة الأحداب","ابتدائية وادي بوتشيشة بويرة الأحداب","ابتدائية حي المخرج الغربي بويرة الأحداب"];

INST.forEach(v => document.getElementById('inst').add(new Option(v, v)));
for(var i=1; i<=12; i++) document.getElementById('grade').add(new Option("الدرجة "+i, i));

var entries = JSON.parse(localStorage.getItem('promo_data') || "[]");
updateTable();

document.getElementById('promoForm').onsubmit = function(e) {
  e.preventDefault();
  var data = { inst: document.getElementById('inst').value, name: document.getElementById('name').value, grade: document.getElementById('grade').value, date: document.getElementById('date').value };
  
  fetch(API_URL, {method: "POST", mode: "no-cors", headers: {"Content-Type": "application/json"}, body: JSON.stringify(data)});
  
  entries.unshift(data);
  localStorage.setItem('promo_data', JSON.stringify(entries.slice(0, 10)));
  updateTable();
  document.getElementById('statusMsg').textContent = "✅ تم الإرسال!";
  this.reset();
};

function updateTable() {
  document.getElementById('tableBody').innerHTML = entries.map(r => `<tr><td>${r.inst}</td><td>${r.name}</td><td>${r.grade}</td><td>${r.date}</td></tr>`).join('');
}
</script>
</body>
</html>
