<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة تحيين الترقيات 2026-2027</title>
<style>
/* الخطوط الأصلية لضمان المظهر الاحترافي */
@font-face{font-family:'MohammadHead';src:local('Mohammad Head'),local('MohammadHead'),url('MohammadHead.woff2') format('woff2'),url('MohammadHead.ttf') format('truetype');font-display:swap}
@font-face{font-family:'BaradaReqa';src:local('Barada Reqa'),local('BaradaReqa'),local('Barada Reqa Regular'),url('BaradaReqa.woff2') format('woff2'),url('BaradaReqa.ttf') format('truetype');font-display:swap}
@font-face{font-family:'MohammadBoldArt1';src:local('Mohammad Bold Art 1'),local('MohammadBoldArt1'),local('Mohammad Bold Art'),url('MohammadBoldArt1.woff2') format('woff2'),url('MohammadBoldArt1.ttf') format('truetype');font-weight:100 900;font-display:swap}

:root{
  --green:#5b2a86; /* البنفسجي الأساسي */
  --red:#d21034;   /* الأحمر للتنبيه */
  --brown:#6a2c91; /* البنفسجي الغامق للنصوص */
  --fh:'MohammadHead','Katibeh','Amiri',serif;
  --fc:'MohammadBoldArt1','MohammadHead',Tahoma,Arial,sans-serif;
  --fb:'BaradaReqa','Aref Ruqaa Ink','Katibeh','Amiri',serif;
}

*,*::before,*::after{box-sizing:border-box}

body {
  margin: 0;
  min-height: 100vh;
  padding: 24px 14px;
  background: #43206b; /* الخلفية الأرجوانية للمنصة */
  color: #333;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.wrap {
  width: min(1040px, 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ===== هيدر السبّورة (تصميم إسناد) ===== */
.blackboard {
  position: relative;
  isolation: isolate;
  width: 100%;
  margin-bottom: 36px;
  padding: 22px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  color: #fffde9;
  text-align: center;
  border: 13px solid #b78ae0; /* إطار السبورة */
  border-radius: 10px;
  background-color: #0a0a0a;
  background-image: radial-gradient(ellipse at 20% 30%,#ffffff0b 0 1px,transparent 2px),radial-gradient(ellipse at 70% 65%,#ffffff0a 0 1px,transparent 2px),repeating-linear-gradient(2deg,#ffffff03 0 1px,transparent 1px 5px),linear-gradient(145deg,#1c1c1c,#050505 70%,#141414);
  box-shadow: inset 0 0 0 3px #ffffff14, inset 0 0 28px #0009, 0 12px 24px #0008;
}

.blackboard::after {
  content: "";
  position: absolute;
  z-index: 0;
  bottom: -22px;
  left: 10%;
  width: 80%;
  height: 12px;
  border: 2px solid #4a2a70;
  border-radius: 0 0 7px 7px;
  background: linear-gradient(#a982d6,#5b3a8a);
  box-shadow: 0 5px 7px #0005;
}

.seal, .badge {
  flex: 0 0 140px;
  width: 140px;
  height: 140px;
}

.seal img, .badge img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.badge {
  background: conic-gradient(from 210deg,#fff3b4,#e2b53a 18%,#a77408 38%,#f6dc7a 56%,#c9971f 76%,#fff0a8 100%);
  border-radius: 50%;
  padding: 8px;
  box-shadow: 0 6px 12px #000a;
}

.title-box { flex: 1; min-width: 0; }
h1 {
  margin: 0;
  color: #fff;
  font-family: var(--fh);
  font-size: clamp(28px, 5vw, 50px);
  text-shadow: 0 0 10px #ffeb3b;
  animation: glow 3s infinite;
}
@keyframes glow { 0%,100%{opacity:1} 50%{opacity:0.8} }
.sub-title { color: #ffeb3b; font-family: var(--fb); margin-top: 5px; font-size: 18px; }

/* ===== البطاقات البيضاء للنصوص والحقول ===== */
.card {
  width: 100%;
  max-width: 850px;
  margin-bottom: 22px;
  padding: 30px;
  background: #ffffff; /* اللون الأبيض للبطاقة */
  border-radius: 8px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

h2 {
  margin: -30px -30px 20px -30px;
  padding: 15px;
  background: var(--green);
  color: white;
  text-align: center;
  border-radius: 8px 8px 0 0;
  font-family: var(--fh);
}

/* ===== الحقول والاستمارات ===== */
.f { margin-bottom: 15px; }
.f label { display: block; margin-bottom: 8px; color: var(--green); font-family: var(--fh); font-size: 20px; }
input, select {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 5px;
  font-family: var(--fc);
  font-size: 17px;
  color: var(--brown);
}

/* ===== الأزرار ===== */
.btn-submit {
  width: 100%;
  padding: 15px;
  background: var(--green);
  color: white;
  border: none;
  border-radius: 5px;
  font-family: var(--fh);
  font-size: 24px;
  cursor: pointer;
  transition: 0.3s;
}
.btn-submit:hover:not(:disabled) { background: var(--red); transform: translateY(-2px); }
.btn-submit:disabled { opacity: 0.6; cursor: wait; }

/* ===== الجدول التفاعلي ===== */
.table-wrap { overflow-x: auto; border: 1px solid #ddd; border-radius: 5px; margin-top: 15px; }
.data-table { width: 100%; border-collapse: collapse; background: white; }
.data-table th { background: var(--green); color: white; padding: 12px; font-family: var(--fh); text-align: center; }
.data-table td { padding: 12px; text-align: center; border-bottom: 1px solid #eee; font-weight: bold; color: var(--brown); }
.data-table tbody tr:nth-child(even){background:#f6f1fb}
.data-table tbody tr:hover{background:#fdecee}

.msg{margin-top:15px;text-align:center;font-weight:bold;font-size:18px}
.msg.success{color:#27ae60}
.msg.error{color:#e74c3c}

footer { margin-top: 30px; text-align: center; color: #ffeb3b; font-family: var(--fb); }

/* إعادة تصميم مستوحاة من منصة حجز الدروس التطبيقية */
:root{--green:#9a7656;--brown:#5b4635;--red:#b84b4b}
body{background:#f2ece5;color:#3f352d;font-family:Arial,sans-serif;padding:22px 14px}
.blackboard{border-color:#c9a987;border-width:10px;border-radius:14px;background-color:#263c31;background-image:radial-gradient(ellipse at 20% 30%,#ffffff0b 0 1px,transparent 2px),radial-gradient(ellipse at 70% 65%,#ffffff0a 0 1px,transparent 2px),repeating-linear-gradient(2deg,#ffffff03 0 1px,transparent 1px 5px),linear-gradient(145deg,#274436,#172b21 70%,#294638);box-shadow:inset 0 0 0 3px #ffffff14,inset 0 0 28px #0009,0 12px 24px #432e1e33}
.blackboard::after{border-color:#674a33;background:linear-gradient(#b58b63,#805a3b)}
h1{text-shadow:0 0 10px #dfc9a4;animation:none}
.sub-title,footer{color:#ead7bb}
.badge{background:conic-gradient(from 210deg,#fff3b4,#e2b53a 18%,#a77408 38%,#f6dc7a 56%,#c9971f 76%,#fff0a8 100%)}
.card{max-width:830px;padding:25px;background:#fff;border:1px solid #eadfd3;border-radius:12px;box-shadow:0 8px 22px #432e1e18}
h2{margin:-25px -25px 20px;padding:13px 16px;background:#9a7656;border-radius:12px 12px 0 0}
.f label{color:#795c43}
input,select{border-color:#d8c9b9;border-radius:6px;color:#5b4635;background:#fff}
input:focus,select:focus{outline:2px solid #c6a582;outline-offset:1px}
.btn-submit{background:#9a7656;border-radius:6px}
.btn-submit:hover:not(:disabled){background:#b84b4b}
.table-wrap{border-color:#e3d8cd;border-radius:8px}
.data-table th{background:#806044}
.data-table td{color:#5b4635}
.data-table tbody tr:nth-child(even){background:#f6f1eb}
.data-table tbody tr:hover{background:#f2e5d9}
.msg.success{color:#477451}
footer{color:#806044}
@media(max-width:640px){body{padding:14px 10px}.blackboard{padding:18px 12px;gap:10px;border-width:7px}.seal,.badge{flex-basis:76px;width:76px;height:76px}.card{padding:20px}.card h2{margin:-20px -20px 18px;font-size:22px}}

/* القرصان الرسميان في الهيدر */
.blackboard{background:#080808;border-color:#b18a61;padding:18px 24px;min-height:190px}
.blackboard::after{border-color:#523b29;background:linear-gradient(#b58b63,#805a3b)}
.seal,.badge{flex:0 0 132px;width:132px;height:132px;border-radius:50%;padding:5px;overflow:hidden;background:radial-gradient(circle at 32% 24%,#fff8d8 0,#d9b66d 20%,#75502b 72%,#2c1c10 100%);border:2px solid #e0c38e;box-shadow:inset 0 3px 5px #fff9,inset 0 -8px 12px #21150d,0 8px 14px #000,0 0 0 3px #57402b}
.seal img,.badge img{width:100%;height:100%;border-radius:50%;object-fit:cover;box-shadow:inset 0 0 10px #0008}
.badge{background:radial-gradient(circle at 32% 24%,#fff 0,#e5d8c8 25%,#96744f 78%,#362418 100%)}
#resultsCard[hidden]{display:none}
@media(max-width:640px){.blackboard{min-height:0;padding:14px 9px}.seal,.badge{flex-basis:82px;width:82px;height:82px}}
</style>
</head>

  <!-- بطاقة البيانات -->
  <section class="card">
    <h2>تعبئة بيانات الترقية</h2>
    <form id="promoForm">
      <div class="f">
        <label>اسم المؤسسة</label>
        <select id="inst" required>
          <option value="">اختر المؤسسة...</option>
        </select>
      </div>
      <div class="f">
        <label>لقب واسم الأستاذ(ة)</label>
        <input type="text" id="name" placeholder="أدخل اللقب والاسم" required>
      </div>
      <div class="f">
        <label>الدرجة الجديدة</label>
        <select id="grade" required></select>
      </div>
      <div class="f">
        <label>تاريخ النفاذ</label>
        <input type="date" id="date" required>
      </div>
      <button type="submit" id="btn" class="btn-submit">إرسال البيانات الآن</button>
      <div id="statusMsg" class="msg"></div>
    </form>
  </section>

  <!-- جدول عرض النتائج -->
  <section class="card" id="resultsCard" hidden>
    <h2>آخر المعلومات المرسلة</h2>
    <div class="table-wrap">
      <table class="data-table" id="resTable">
        <thead>
          <tr>
            <th>#</th>
            <th>المؤسسة</th>
            <th>الأستاذ</th>
            <th>الدرجة</th>
            <th>التاريخ</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </section>

  <footer>
    <div>برمجة الأستاذ/المفتش: بلعدل محمد</div>
    <div>حقوق النشر محفوظة 2026/2027</div>
  </footer>
</div>

<script>
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyJtMos4XrkQCigof1WrO7kFfM4GTsz6eiLAmF5vd09h1NAZAGNNXobx36pymCiju-gSQ/exec";

var INST = ["ابتدائية طارق بن زياد حدّ الصّحاري","ابتدائية بن عثمان الشيخ حدّ الصّحاري","ابتدائية زيوش محمد حدّ الصّحاري","ابتدائية نوع ب حد الصحاري حدّ الصّحاري","ابتدائية عكار أحمد حدّ الصّحاري","ابتدائية المجاهد قويدري خليفة حدّ الصّحاري","ابتدائية نمط 2 حي 165 مسكن حدّ الصّحاري","ابتدائية العقيد عميروش بويرة الأحداب","ابتدائية الشيخ المختار خليفة بويرة الأحداب","ابتدائية الصقيعة بويرة الأحداب","ابتدائية اولاد سي عمر بويرة الأحداب","ابتدائية وادي بوعيشة بويرة الأحداب","ابتدائية حاسي الدهيم بويرة الأحداب","ابتدائية المجمع المدرسي الجديد بويرة الأحداب","ابتدائية وادي بوتشيشة بويرة الأحداب","ابتدائية حي المخرج الغربي بويرة الأحداب"];

var instSel = document.getElementById('inst');
INST.forEach(v => instSel.add(new Option(v, v)));

var gradeSel = document.getElementById('grade');
for(var i=1; i<=12; i++) gradeSel.add(new Option("الدرجة "+i, i));

var entries = JSON.parse(localStorage.getItem('promo_data') || "[]");
updateTable();

var form = document.getElementById('promoForm');
var msg = document.getElementById('statusMsg');
var btn = document.getElementById('btn');

form.onsubmit = function(e) {
  e.preventDefault();

  var data = {
    inst: document.getElementById('inst').value,
    name: document.getElementById('name').value,
    grade: document.getElementById('grade').value,
    date: document.getElementById('date').value,
    token: "promotion_user"
  };

  btn.disabled = true;
  msg.textContent = "جاري الإرسال والمزامنة...";
  msg.className = "msg";

  fetch(SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(data)
  })
  .then(() => {
    msg.textContent = "✅ تم الإرسال بنجاح إلى Google Sheets!";
    msg.className = "msg success";

    entries.unshift(data);
    localStorage.setItem('promo_data', JSON.stringify(entries.slice(0, 20)));
    updateTable(true);
    form.reset();
  })
  .catch(err => {
    msg.textContent = "❌ خطأ في الاتصال. حاول مرة أخرى.";
    msg.className = "msg error";
  })
  .finally(() => {
    btn.disabled = false;
  });
};

function updateTable() {
  var resultsCard = document.getElementById('resultsCard');
  if (resultsCard && showResults) resultsCard.hidden = false;
  var tbody = document.getElementById('tableBody');
  tbody.innerHTML = "";
  entries.forEach((r, i) => {
    var tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${entries.length - i}</td>
      <td>${r.inst}</td>
      <td>${r.name}</td>
      <td>${r.grade}</td>
      <td>${r.date}</td>
    `;
    tbody.appendChild(tr);
  });
}
</script>
</body>
